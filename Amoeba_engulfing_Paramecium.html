<!DOCTYPE html>
<html>
<head><title>Video Clip</title></head>
<body>
  <div id="player"></div>

  <script>
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

    var player;
    var endTime = 55; // <-- change this to your stop point, in seconds

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '630',
        width: '1200',
        videoId: 'GbptpDSHQEM', // <-- your video ID
        playerVars: { start: 5 }, // <-- your start point, in seconds
        events: { 'onStateChange': onPlayerStateChange }
      });
    }

    function onPlayerStateChange(event) {
      if (event.data == YT.PlayerState.PLAYING) checkTime();
    }

    function checkTime() {
      if (player.getCurrentTime() >= endTime) {
        player.pauseVideo();
      } else {
        setTimeout(checkTime, 250);
      }
    }
  </script>
</body>
</html>
