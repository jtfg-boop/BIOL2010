<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Concentration gradient</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
    }
    video {
      display: block;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      height: auto;
      margin: 0 auto;
      background: #000;
    }

    .reading {
      max-width: 1800px;
      margin: 40px auto;
      font-size: 2.2em;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>

<body>

  <!-- ===================== VIDEO (clip: 0:16 to 0:48) ===================== -->
  <video id="clip" controls playsinline preload="metadata" src="Osmosis_JV.mp4#t=16,48"></video>


  <!-- ===================== READING ===================== -->
  <div class="reading">

    <h3>Concentration gradient: A physical space in which there is a range of concentrations of a single substance is said to have a concentration gradient. “Down” = direction high to low; “against/up” = low to high</h3>


  </div>


  <!-- Keeps playback inside 16–48 s in every browser, and lets the clip replay from 16 s -->
  <script>
    (function () {
      var START = 14;
      var END = 48;
      var v = document.getElementById('clip');

      v.addEventListener('loadedmetadata', function () {
        if (v.currentTime < START) v.currentTime = START;
      });

      v.addEventListener('timeupdate', function () {
        if (v.currentTime >= END) {
          v.pause();
          v.currentTime = END;
        }
      });

      v.addEventListener('play', function () {
        if (v.currentTime >= END - 0.1 || v.currentTime < START) {
          v.currentTime = START;
        }
      });

      v.addEventListener('seeking', function () {
        if (v.currentTime < START) v.currentTime = START;
        else if (v.currentTime > END) v.currentTime = END;
      });
    })();
  </script>

</body>
</html>
